name: Lean verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies and fetch Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Build
        run: lake build
      - name: Audit exported theorem axioms
        run: |
          set -o pipefail
          lake env lean Waffle.lean | tee axiom-audit.txt
          lake env lean Waffle/Geometry.lean | tee -a axiom-audit.txt
          lake env lean Waffle/Similarity.lean | tee -a axiom-audit.txt
          lake env lean Waffle/Characterization.lean | tee -a axiom-audit.txt
          lake env lean Waffle/Stability.lean | tee -a axiom-audit.txt
          lake env lean Waffle/Sampling.lean | tee -a axiom-audit.txt
          lake env lean Waffle/Chain.lean | tee -a axiom-audit.txt
          ! grep -E 'sorryAx|declaration uses .sorry.' axiom-audit.txt
      - name: Build evidence-linked publication
        run: python3 publication/build.py --audit axiom-audit.txt --commit "$GITHUB_SHA" --out site
      - name: Upload verified paper
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - name: Deploy verified paper
        id: deployment
        uses: actions/deploy-pages@v4
